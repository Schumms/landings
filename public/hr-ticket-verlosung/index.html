<style>
@font-face{font-family:'Buenos Aires';src:url('https://landing.schumms.com/fonts/BuenosAires-Black900.woff2') format('woff2');font-weight:900;font-style:normal;font-display:swap;}
@font-face{font-family:'Buenos Aires';src:url('https://landing.schumms.com/fonts/BuenosAires-SemiBold600.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap;}
@font-face{font-family:'Buenos Aires';src:url('https://landing.schumms.com/fonts/BuenosAires-Regular400.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}

<style>
:root{
  --teal-dark:#0E3B3D;
  --mint:#00D1A3;
  --text-dark:#333333;
  --placeholder:#9CA3AF;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{overflow-x:hidden;}
body{overflow-x:hidden;max-width:100vw;font-family:'Buenos Aires',system-ui,-apple-system,sans-serif;color:var(--text-dark);background:#fff;}

#sr-page{display:grid;grid-template-columns:45fr 55fr;min-height:100vh;}

/* ---- Linke Panel: Teal ---- */
#sr-left{background:var(--teal-dark);color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:48px 56px;}
#sr-left .sr-logo{margin-bottom:auto;}
#sr-left .sr-logo img{height:14px;width:auto;display:block;}
#sr-left .sr-copy{margin-top:64px;}
.eyebrow{display:inline-flex;align-items:center;gap:10px;color:var(--mint);font-size:0.8125rem;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;}
.eyebrow i{width:22px;height:2px;background:currentColor;display:inline-block;}
#sr-left h1{font-size:clamp(2.4rem,4.2vw,3.6rem);font-weight:900;line-height:1.08;margin:22px 0 20px;}
#sr-left .sr-sub{font-size:1.0625rem;line-height:1.6;color:rgba(255,255,255,0.82);max-width:44ch;}
#sr-left .sr-sub a{color:var(--mint);text-decoration:underline;}
.sr-note{font-size:0.8125rem;color:rgba(255,255,255,0.55);line-height:1.5;}

/* ---- Rechtes Panel: Formular ---- */
#sr-right{display:flex;align-items:center;justify-content:center;padding:64px 56px;}
#sr-formwrap{width:100%;max-width:520px;}

#sr-form{display:flex;flex-direction:column;gap:1.25rem;}
.sr-row2col{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;}
.sr-field label{display:block;font-size:0.75rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-dark);margin-bottom:6px;}
.sr-field .req{color:var(--mint);}
#sr-form input[type="email"],#sr-form input[type="text"],#sr-form input[type="tel"]{
  width:100%;border:1px solid #D8DDE1;border-radius:4px;padding:12px 14px;
  font-family:inherit;font-size:1rem;color:var(--text-dark);background:#fff;outline:none;
  transition:border-color .15s ease, box-shadow .15s ease;
}
#sr-form input[type="email"]::placeholder,#sr-form input[type="text"]::placeholder,#sr-form input[type="tel"]::placeholder{color:var(--placeholder);}
#sr-form input[type="email"]:focus,#sr-form input[type="text"]:focus,#sr-form input[type="tel"]:focus{border-color:var(--mint);box-shadow:0 0 0 2px rgba(0,209,163,0.25);}
#sr-form input.sr-invalid{border-color:#8b0000;}

.sr-consent{display:flex;gap:10px;align-items:flex-start;font-size:0.75rem;line-height:1.55;color:var(--text-dark);cursor:pointer;}
.sr-consent input{margin-top:2px;accent-color:var(--mint);width:15px;height:15px;flex-shrink:0;}
.sr-consent a{color:var(--mint);text-decoration:underline;}

.sr-error{color:#8b0000;font-size:0.8125rem;margin-top:6px;}

#sr-form button[type="submit"]{
  background:var(--mint);color:#062622;border:none;border-radius:4px;
  font-family:inherit;font-size:0.8125rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
  padding:16px 28px;width:100%;cursor:pointer;transition:filter .15s ease,opacity .15s ease;
}
#sr-form button[type="submit"]:hover{filter:brightness(1.08);}
#sr-form button[disabled]{opacity:0.6;cursor:wait;}

.sr-formmsg{font-size:0.875rem;margin-top:4px;}
.sr-formmsg.ok{color:#0E3B3D;}
.sr-formmsg.err{color:#8b0000;}

/* ---- Mobile ---- */
@media (max-width:860px){
  #sr-page{display:flex;flex-direction:column;min-height:100vh;}
  #sr-left{padding:28px 20px 40px;}
  #sr-left h1{font-size:2.1rem;}
  #sr-left .sr-copy{margin-top:40px;}
  #sr-right{padding:40px 20px 56px;}
}
@media (max-width:480px){
  #sr-left{padding:22px 20px 34px;}
  #sr-left h1{font-size:1.95rem;}
  #sr-left .sr-sub{font-size:0.9375rem;}
  #sr-right{padding:34px 20px 48px;}
}
</style>
</head>
<body>

<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NDNB35DX"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<div id="sr-page">

  <!-- Linke Panel -->
  <div id="sr-left">
    <div class="sr-logo"><img src="https://landing.schumms.com/images/schumms-logo-white.png" alt="Schumm und Rösch"></div>
    <div class="sr-copy">
      <span class="eyebrow"><i></i>HR Ticket Verlosung</span>
      <h1>Jetzt eins von drei Tickets gewinnen!</h1>
      <p class="sr-sub">Füll das Formular aus und sichere dir die Chance auf eins von drei Tickets.
        <strong>Jetzt teilnehmen bis zum 14. Oktober.</strong></p>
    </div>
    <p class="sr-note">Die Teilnahme ist kostenlos und unverbindlich. Gewinnbenachrichtigung per E-Mail.</p>
  </div>

  <!-- Rechtes Panel: Formular -->
  <div id="sr-right">
    <div id="sr-formwrap">
      <form id="sr-form" novalidate>
        <div class="sr-row2col">
          <div class="sr-field">
            <label for="sr-firstname">Vorname <span class="req">*</span></label>
            <input type="text" id="sr-firstname" name="firstname" placeholder="Vorname" required autocomplete="given-name">
          </div>
          <div class="sr-field">
            <label for="sr-lastname">Nachname <span class="req">*</span></label>
            <input type="text" id="sr-lastname" name="lastname" placeholder="Nachname" required autocomplete="family-name">
          </div>
        </div>
        <div class="sr-field">
          <label for="sr-email">E-Mail <span class="req">*</span></label>
          <input type="email" id="sr-email" name="email" placeholder="du@firma.de" required autocomplete="email">
        </div>
        <div class="sr-field">
          <label for="sr-phone">Telefonnummer <span class="req">*</span></label>
          <input type="tel" id="sr-phone" name="phone" placeholder="+49 ..." required autocomplete="tel">
        </div>
        <div class="sr-field">
          <label for="sr-company">Unternehmen <span class="req">*</span></label>
          <input type="text" id="sr-company" name="company" placeholder="Firma" required autocomplete="organization">
        </div>
        <div class="sr-field">
          <label for="sr-jobtitle">Jobtitel <span class="req">*</span></label>
          <input type="text" id="sr-jobtitle" name="job_titel" placeholder="z.B. HR Manager" required autocomplete="organization-title">
        </div>
        <label class="sr-consent">
          <input type="checkbox" id="sr-consent">
          <span>Ich willige in die Verarbeitung meiner Daten zur Teilnahme an der Verlosung ein und habe die
            <a href="https://www.schumms.com/datenschutz" target="_blank" rel="noopener">Datenschutzerklärung</a> gelesen. *</span>
        </label>
        <button type="submit">Jetzt teilnehmen →</button>
        <p class="sr-formmsg" id="sr-formmsg" hidden></p>
      </form>
    </div>
  </div>

</div>

<script>
(function(){
  var form = document.getElementById('sr-form');
  var msg = document.getElementById('sr-formmsg');
  var button = form.querySelector('button[type="submit"]');
  var consent = document.getElementById('sr-consent');
  var API = 'https://api-eu1.hsforms.com/submissions/v3/integration/submit/146949753/21ad3bbe-8fd7-4af2-99d7-175d7a1c1ac0';

  function validEmail(v){
    return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
  }

  function clearInvalid(input){
    input.classList.remove('sr-invalid');
  }
  form.querySelectorAll('input[type="text"],input[type="email"],input[type="tel"]').forEach(function(inp){
    inp.addEventListener('input', function(){ clearInvalid(inp); });
  });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    msg.hidden = true;

    var firstInvalid = null;
    var fields = [];

    form.querySelectorAll('input[type="text"],input[type="email"],input[type="tel"]').forEach(function(inp){
      var value = String(inp.value || '').trim();
      var isEmail = inp.type === 'email';
      var bad = (inp.required && !value) || (isEmail && value && !validEmail(value));
      if(bad){
        inp.classList.add('sr-invalid');
        if(!firstInvalid) firstInvalid = inp;
      } else {
        fields.push({name: inp.name, value: value});
      }
    });

    if(firstInvalid){
      firstInvalid.focus();
      return;
    }

    if(!consent.checked){
      msg.className = 'sr-formmsg err';
      msg.textContent = 'Bitte bestätige die Datenschutzerklärung.';
      msg.hidden = false;
      return;
    }

    button.disabled = true;

    fetch(API, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        fields: fields,
        context: {pageName: 'HR Ticket Verlosung'}
      })
    }).then(function(res){
      if(!res.ok) throw new Error(String(res.status));
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({
        'event': 'form_submission',
        'form_id': 'hr_ticket_verlosung'
      });
      window.location.href = 'danke/';
    }).catch(function(){
      button.disabled = false;
      msg.className = 'sr-formmsg err';
      msg.textContent = 'Das hat leider nicht geklappt. Bitte versuch es noch einmal — oder schreib uns an info@schumms.com.';
      msg.hidden = false;
    });
  });
})();
</script>

</body>
</html>
