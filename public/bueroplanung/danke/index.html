<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Danke für deine Anfrage | Schumm und Rösch</title>
<meta name="description" content="Vielen Dank für deine Anfrage. Wir melden uns innerhalb von 24 Stunden bei dir.">
<meta name="robots" content="noindex,nofollow">
<link rel="canonical" href="https://landing.schumms.com/bueroplanung/danke/">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="theme-color" content="#133F42">
<style>
:root{--sur-green:#01DBA2;--sur-ink:#133F42;--sur-paper:#FFFFFF;--grey-100:#EDEDE8;--grey-600:#51514B;--font-brand:"Buenos Aires","Helvetica Neue",Arial,sans-serif}
@font-face{font-family:"Buenos Aires";src:url("../fonts/BuenosAires-Light.woff2") format("woff2");font-weight:300;font-display:swap}
@font-face{font-family:"Buenos Aires";src:url("../fonts/BuenosAires-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Buenos Aires";src:url("../fonts/BuenosAires-SemiBold.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Buenos Aires";src:url("../fonts/BuenosAires-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Buenos Aires";src:url("../fonts/BuenosAires-Black.woff2") format("woff2");font-weight:900;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-brand);background:var(--sur-ink);color:var(--sur-paper);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px}
.wrap{max-width:560px;text-align:center}
.check{width:72px;height:72px;border-radius:50%;background:var(--sur-green);display:flex;align-items:center;justify-content:center;margin:0 auto 32px}
.check svg{width:36px;height:36px}
h1{font-weight:900;font-size:clamp(2rem,5vw,3rem);line-height:1.05;letter-spacing:-.02em;margin-bottom:20px}
p{font-size:1.1rem;line-height:1.6;color:var(--grey-100);margin-bottom:36px}
.btn{display:inline-flex;align-items:center;justify-content:center;font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:.9375rem;padding:14px 28px;background:var(--sur-green);color:var(--sur-ink);border:1.5px solid var(--sur-green);text-decoration:none;transition:filter 120ms cubic-bezier(.22,.61,.36,1)}
.btn:hover{filter:brightness(.94)}
.logo{margin-bottom:48px}
.logo img{height:26px;width:auto;display:block;margin:0 auto}
</style>
</head>
<body>

<div class="wrap">
  <div class="logo"><img src="../images/sur-logo-white.webp" alt="Schumm und Rösch" width="1000" height="84" style="height:26px;width:auto" loading="eager"></div>
  <div class="check">
    <svg viewBox="0 0 24 24" fill="none" stroke="#133F42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
  </div>
  <h1>Danke für deine Anfrage!</h1>
  <p>Wir haben deine Nachricht erhalten und melden uns innerhalb von 24 Stunden bei dir — mit konkreten nächsten Schritten und dem passenden Workshop-Format.</p>
  <a class="btn" href="https://www.schumms.com">Zurück zur Website</a>
</div>

</body>
</html>
