  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

<\u002Fscript>\n  <style>\n    *{box-sizing:border-box;}\n    body{margin:0;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-brand);-webkit-font-smoothing:antialiased;}\n    a{color:var(--green-600);text-decoration:none;transition:color .15s ease;}\n    a:hover{color:var(--green-700);}\n    .disp{font-weight:900;letter-spacing:-0.02em;line-height:0.95;}\n    .lede{font-weight:400;line-height:1.55;color:var(--text-secondary);}\n    [data-prog-card]{transition:transform .2s var(--ease-standard), box-shadow .2s var(--ease-standard);}\n    [data-prog-card]:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);}\n    @media(max-width:860px){\n      [data-hero-grid],[data-speaker-grid],[data-form-grid],[data-workshop-grid],[data-inhalte-grid]{grid-template-columns:1fr !important;}\n      [data-inhalte-grid] [style*=\"sticky\"]{position:static !important;}\n      [data-benefit-grid]{grid-template-columns:1fr 1fr !important;}\n      [data-prob-grid]{grid-template-columns:1fr !important;}\n      [data-prob-col]{border-right:none !important;border-top:1px solid rgba(255,255,255,0.16);padding:24px 0 0 !important;}\n      [data-hide-narrow]{display:none !important;}\n    }\n    @media(max-width:560px){\n      [data-benefit-grid]{grid-template-columns:1fr !important;}\n    }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"width:100%;overflow-x:hidden;\">\n\n  <!-- NAV -->\n  <nav style=\"position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px clamp(20px,5vw,64px);background:rgba(255,255,255,0.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border-subtle);\">\n    <a href=\"https://www.schumms.com\" style=\"display:flex;\"><img src=\"98a5bbac-f04b-413c-905d-57364d439066\" alt=\"Schumm und Rösch\" style=\"height:26px;width:auto;display:block;\"><\u002Fa>\n    <div style=\"display:flex;align-items:center;gap:24px;\">\n      <span style=\"display:none;font-size:0.8125rem;font-weight:600;letter-spacing:0.04em;color:var(--text-secondary);\" data-hide-narrow=\"\">Bei euch oder bei uns · Kostenlos<\u002Fspan>\n      <a href=\"#anmelden\" style=\"display:inline-flex;align-items:center;gap:8px;padding:10px 20px;background:var(--sur-ink);color:#fff;font-weight:700;font-size:0.875rem;letter-spacing:0.04em;text-transform:uppercase;border-radius:var(--radius-md);\">Termin sichern<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <!-- HERO -->\n  <header style=\"position:relative;width:100%;overflow:hidden;background:var(--sur-bone);color:var(--text-primary);padding:clamp(64px,10vw,128px) clamp(20px,5vw,64px);border-bottom:1px solid var(--border-subtle);\">\n    <div aria-hidden=\"true\" style=\"position:absolute;top:-14vw;right:-6vw;width:38vw;height:38vw;max-width:520px;max-height:520px;border-radius:999px;background:radial-gradient(circle at 50% 50%, rgba(253,120,87,0.16), rgba(253,120,87,0) 70%);pointer-events:none;\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:1180px;margin:0 auto;\">\n      <x-import component-from-global-scope=\"SchummUndRSchDesignSystem_65897b.Eyebrow\" color=\"var(--orange-600)\" hint-size=\"auto,18px\">Kostenloser Workshop · Bei euch oder bei uns<\u002Fx-import>\n      <h1 class=\"disp\" style=\"font-size:clamp(3.5rem,11vw,8rem);margin:24px 0 0;\">HR<span style=\"color:var(--sur-orange);\">@<\u002Fspan>WORK<\u002Fh1>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px;margin:28px 0 0;\">\n        <span style=\"padding:9px 20px;background:#FEDCD4;color:var(--orange-800);border-radius:999px;font-weight:700;font-size:0.9375rem;letter-spacing:0.02em;\">Talente<\u002Fspan>\n        <span style=\"padding:9px 20px;background:#FEDCD4;color:var(--orange-800);border-radius:999px;font-weight:700;font-size:0.9375rem;letter-spacing:0.02em;\">Kultur<\u002Fspan>\n        <span style=\"padding:9px 20px;background:#FEDCD4;color:var(--orange-800);border-radius:999px;font-weight:700;font-size:0.9375rem;letter-spacing:0.02em;\">Office<\u002Fspan>\n      <\u002Fdiv>\n      <p class=\"lede\" style=\"font-size:clamp(1.1875rem,2vw,1.5rem);color:var(--text-primary);max-width:44ch;margin:32px 0 40px;\">Der kostenlose HR-Workshop für euer Büro — für Arbeitswelten, die Menschen anziehen, halten und zu Orten machen, an die man gerne zurückkehrt.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:20px;\">\n        <a href=\"#anmelden\" style=\"display:inline-flex;align-items:center;gap:10px;padding:16px 30px;background:var(--sur-green);color:var(--sur-ink);font-weight:700;font-size:1.0625rem;letter-spacing:0.04em;text-transform:uppercase;border-radius:var(--radius-md);\">Termin sichern <span aria-hidden=\"true\">→<\u002Fspan><\u002Fa>\n        <span style=\"font-size:0.9375rem;font-weight:600;color:var(--text-secondary);\">Vor Ort · Kostenlos &amp; unverbindlich<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- WAS IST HR@WORK -->\n  <section style=\"background:var(--sur-ink);color:#fff;padding:clamp(64px,9vw,120px) clamp(20px,5vw,64px);\">\n    <div style=\"max-width:1180px;margin:0 auto;\">\n      <x-import component-from-global-scope=\"SchummUndRSchDesignSystem_65897b.Eyebrow\" color=\"var(--sur-orange)\" hint-size=\"auto,18px\">Was ist HR@WORK?<\u002Fx-import>\n      <h2 class=\"disp\" style=\"font-size:clamp(2.25rem,4.5vw,3.5rem);margin:20px 0 0;max-width:22ch;\">HR gestaltet <span style=\"color:var(--sur-orange);\">moderne Arbeitswelten<\u002Fspan> — und dazu gehören Räume<\u002Fh2>\n      <p style=\"font-size:1.25rem;line-height:1.5;color:rgba(255,255,255,0.7);margin:24px 0 0;max-width:62ch;\">Wir glauben: HR trägt heute mehr denn je Verantwortung für die Gestaltung moderner Arbeitswelten. HR@WORK ist ein kompakter, strukturierter Review eurer HR-Strategie im Hinblick auf eure Arbeitsumgebung.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:56px;\" data-prob-grid=\"\">\n        <div data-prob-col=\"\" style=\"padding:0 40px 0 0;border-right:1px solid rgba(255,255,255,0.16);\">\n          <div class=\"disp\" style=\"font-size:2.25rem;color:var(--sur-orange);margin-bottom:18px;\">01<\u002Fdiv>\n          <h3 style=\"font-weight:700;font-size:1.3125rem;margin:0 0 12px;\">Kompakter Review<\u002Fh3>\n          <p style=\"font-size:0.9375rem;line-height:1.55;color:rgba(255,255,255,0.68);margin:0;\">Gemeinsam analysieren wir, wie eure Arbeitswelt gestaltet ist und welches Potenzial darin steckt.<\u002Fp>\n        <\u002Fdiv>\n        <div data-prob-col=\"\" style=\"padding:0 40px;border-right:1px solid rgba(255,255,255,0.16);\">\n          <div class=\"disp\" style=\"font-size:2.25rem;color:var(--sur-orange);margin-bottom:18px;\">02<\u002Fdiv>\n          <h3 style=\"font-weight:700;font-size:1.3125rem;margin:0 0 12px;\">Räume als Hebel<\u002Fh3>\n          <p style=\"font-size:0.9375rem;line-height:1.55;color:rgba(255,255,255,0.68);margin:0;\">Wie Räume Talente gewinnen und binden, eure Kultur widerspiegeln und wie „Back to Office\" nachhaltig gelingt.<\u002Fp>\n        <\u002Fdiv>\n        <div data-prob-col=\"\" style=\"padding:0 0 0 40px;\">\n          <div class=\"disp\" style=\"font-size:2.25rem;color:var(--sur-orange);margin-bottom:18px;\">03<\u002Fdiv>\n          <h3 style=\"font-weight:700;font-size:1.3125rem;margin:0 0 12px;\">Der Mensch im Mittelpunkt<\u002Fh3>\n          <p style=\"font-size:0.9375rem;line-height:1.55;color:rgba(255,255,255,0.68);margin:0;\">Bei allem steht der Mensch im Mittelpunkt — wir beginnen mit dem Warum.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- INHALTE -->\n  <section style=\"background:#FEDCD4;padding:clamp(56px,7vw,96px) clamp(20px,5vw,64px);\">\n    <div style=\"max-width:1180px;margin:0 auto;display:grid;grid-template-columns:0.82fr 1.18fr;gap:clamp(36px,5vw,72px);align-items:start;\" data-inhalte-grid=\"\">\n      <div style=\"position:sticky;top:24px;\">\n        <x-import component-from-global-scope=\"SchummUndRSchDesignSystem_65897b.Eyebrow\" color=\"var(--orange-600)\" hint-size=\"auto,18px\">Inhalte des Workshops<\u002Fx-import>\n        <h2 class=\"disp\" style=\"font-size:clamp(2rem,3.4vw,3.25rem);margin:18px 0 0;color:var(--sur-ink);\">Drei Schritte.<br>Ein klares Bild.<\u002Fh2>\n        <p style=\"font-size:1.125rem;line-height:1.5;margin:22px 0 0;max-width:28ch;color:var(--sur-ink-soft);\">Von der Bestandsaufnahme bis zu ersten Ideen — strukturiert und auf euer Büro zugeschnitten.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:16px;\">\n        <sc-for list=\"{{ program }}\" as=\"b\" hint-placeholder-count=\"3\">\n          <div data-prog-card=\"\" style=\"background:#fff;border:1.5px solid rgba(226,84,47,0.16);border-radius:var(--radius-lg);padding:clamp(24px,2.6vw,34px);display:flex;gap:clamp(20px,3vw,34px);align-items:center;box-shadow:var(--shadow-md);\">\n            <span class=\"disp\" style=\"font-size:clamp(2.6rem,4.4vw,3.6rem);color:var(--sur-orange);line-height:1;flex-shrink:0;min-width:1.4em;\">{{ b.n }}<\u002Fspan>\n            <div style=\"display:flex;flex-direction:column;gap:8px;flex:1;\">\n              <span style=\"font-size:0.6875rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--orange-600);\">Schritt {{ b.n }}<\u002Fspan>\n              <h3 style=\"font-weight:900;letter-spacing:-0.01em;font-size:1.3rem;margin:0;line-height:1.15;\">{{ b.title }}<\u002Fh3>\n              <p style=\"font-size:0.9375rem;line-height:1.5;color:var(--text-secondary);margin:0;\">{{ b.desc }}<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"width:48px;height:48px;border-radius:12px;background:var(--orange-100);display:flex;align-items:center;justify-content:center;flex-shrink:0;\">{{ b.icon }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- BEGLEITUNG -->\n  <section style=\"background:var(--surface-page);padding:clamp(56px,8vw,96px) clamp(20px,5vw,64px) clamp(28px,4vw,44px);\">\n    <div style=\"max-width:1180px;margin:0 auto;\">\n      <div style=\"max-width:760px;\">\n        <x-import component-from-global-scope=\"SchummUndRSchDesignSystem_65897b.Eyebrow\" color=\"var(--orange-600)\" hint-size=\"auto,18px\">Deine Begleitung<\u002Fx-import>\n        <h2 class=\"disp\" style=\"font-size:clamp(2.25rem,4.5vw,3.25rem);margin:20px 0 0;\">Ein Experte aus unserem Team<\u002Fh2>\n        <p class=\"lede\" style=\"font-size:1.25rem;line-height:1.5;color:var(--text-primary);margin:24px 0 0;\">Durch den Workshop führt dich eine Expertin oder ein Experte von Schumm und Rösch — mit Erfahrung im Arbeitsplatz der Zukunft und einem Gespür dafür, was Räume mit Menschen machen. Wir verbinden Raumgestaltung, Unternehmenskultur und Organisation mit aktuellen Entwicklungen rund um New Work und moderne HR.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- MEHRWERT -->\n  <section style=\"background:var(--surface-page);color:var(--text-primary);padding:clamp(28px,4vw,44px) clamp(20px,5vw,64px) clamp(28px,4vw,44px);\">\n    <div style=\"max-width:1180px;margin:0 auto;\">\n      <div style=\"max-width:760px;margin-bottom:64px;\">\n        <x-import component-from-global-scope=\"SchummUndRSchDesignSystem_65897b.Eyebrow\" color=\"var(--orange-600)\" hint-size=\"auto,18px\">Dein Mehrwert<\u002Fx-import>\n        <h2 class=\"disp\" style=\"font-size:clamp(2.25rem,5vw,3.75rem);margin:20px 0 0;\">Was du aus dem Workshop mitnimmst<\u002Fh2>\n        <p style=\"font-size:1.25rem;line-height:1.5;color:var(--text-secondary);margin:24px 0 0;\">Ein objektiver Blick von außen — mit konkreten Ideen für die nächsten Schritte.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(24px,3vw,40px);\" data-benefit-grid=\"\">\n        <sc-for list=\"{{ benefits }}\" as=\"bn\" hint-placeholder-count=\"3\">\n          <div style=\"border-top:2px solid var(--sur-ink);padding-top:24px;\">\n            <div class=\"disp\" style=\"font-size:2.25rem;color:var(--sur-orange);margin-bottom:18px;\">{{ bn.n }}<\u002Fdiv>\n            <h3 style=\"font-weight:700;font-size:1.3125rem;margin:0 0 12px;\">{{ bn.title }}<\u002Fh3>\n            <p style=\"font-size:0.9375rem;line-height:1.5;color:var(--text-secondary);margin:0;\">{{ bn.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top:56px;\">\n        <a href=\"#anmelden\" style=\"display:inline-flex;align-items:center;gap:10px;padding:15px 30px;background:transparent;color:var(--sur-ink);border:2px solid var(--sur-ink);font-weight:700;font-size:1.0625rem;letter-spacing:0.04em;text-transform:uppercase;border-radius:var(--radius-md);\">Termin sichern <span aria-hidden=\"true\">→<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- WARUM KOSTENLOS -->\n  <section style=\"background:var(--surface-page);padding:clamp(28px,4vw,44px) clamp(20px,5vw,64px) clamp(64px,9vw,96px);\">\n    <div style=\"max-width:1180px;margin:0 auto;background:var(--sur-orange);border-radius:var(--radius-xl);padding:clamp(56px,8vw,104px) clamp(40px,6vw,80px);display:grid;grid-template-columns:1.4fr 0.6fr;gap:40px;align-items:center;\" data-workshop-grid=\"\">\n      <div>\n        <div style=\"display:inline-flex;align-items:center;gap:10px;padding:7px 16px;background:var(--sur-ink);color:#fff;border-radius:999px;font-size:0.75rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:24px;\">Komplett kostenlos<\u002Fdiv>\n        <h2 class=\"disp\" style=\"font-size:clamp(2rem,4vw,3rem);margin:0 0 20px;color:var(--sur-ink);\">Warum ist der Workshop kostenlos?<\u002Fh2>\n        <p style=\"font-size:1.125rem;line-height:1.55;color:var(--sur-ink);margin:0;max-width:60ch;\">Wir möchten die Arbeitswelten der Zukunft positiv verändern. Mit HR@WORK schenken wir dir einen Impuls, um eure Räume und Kultur noch besser auf die Menschen auszurichten — und so gemeinsam die Arbeitswelt Stück für Stück besser zu machen.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:flex-start;\">\n        <a href=\"#anmelden\" style=\"display:inline-flex;align-items:center;gap:10px;padding:16px 30px;background:var(--sur-ink);color:#fff;font-weight:700;font-size:1.0625rem;letter-spacing:0.04em;text-transform:uppercase;border-radius:var(--radius-md);\">Termin sichern <span aria-hidden=\"true\">→<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- REGISTRATION -->\n  <section id=\"anmelden\" style=\"background:var(--sur-mist);padding:clamp(64px,9vw,120px) clamp(20px,5vw,64px);\">\n    <div style=\"max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:clamp(40px,6vw,80px);align-items:start;\" data-form-grid=\"\">\n      <div>\n        <x-import component-from-global-scope=\"SchummUndRSchDesignSystem_65897b.Eyebrow\" color=\"var(--orange-600)\" hint-size=\"auto,18px\">Anmeldung<\u002Fx-import>\n        <h2 class=\"disp\" style=\"font-size:clamp(2.25rem,5vw,3.5rem);margin:20px 0 0;\">Jetzt Workshop-Termin sichern<\u002Fh2>\n        <p class=\"lede\" style=\"font-size:1.25rem;margin:24px 0 32px;\">Trag dich ein — wir melden uns bei dir, um einen passenden Termin für euch vor Ort abzustimmen. Kostenlos und unverbindlich.<\u002Fp>\n        <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;max-width:420px;\">\n          <sc-for list=\"{{ perks }}\" as=\"p\" hint-placeholder-count=\"3\">\n            <li style=\"display:flex;gap:12px;align-items:flex-start;font-size:1.0625rem;line-height:1.4;color:var(--text-primary);font-weight:500;\">\n              <span style=\"color:var(--green-600);font-weight:900;flex-shrink:0;\">✔<\u002Fspan><span>{{ p }}<\u002Fspan>\n            <\u002Fli>\n          <\u002Fsc-for>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1.5px solid var(--border-subtle);border-radius:var(--radius-lg);padding:clamp(28px,3.5vw,44px);\">\n        <sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;align-items:flex-start;gap:16px;padding:24px 0;\">\n            <div style=\"width:52px;height:52px;border-radius:999px;background:var(--sur-green);display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:var(--sur-ink);font-weight:900;\">✓<\u002Fdiv>\n            <h3 class=\"disp\" style=\"font-size:1.75rem;margin:0;\">Danke — wir melden uns!<\u002Fh3>\n            <p class=\"lede\" style=\"margin:0;font-size:1.0625rem;\">Wir setzen uns mit dir in Verbindung, um den HR@WORK Workshop-Termin für euer Büro abzustimmen.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ notSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n          <form sc-camel-on-submit=\"{{ submit }}\" style=\"display:flex;flex-direction:column;gap:20px;\">\n            <div style=\"display:flex;flex-direction:column;gap:6px;\">\n              <label for=\"f-anrede\" style=\"font-family:var(--font-brand);font-size:0.8125rem;font-weight:600;letter-spacing:0.04em;color:var(--text-secondary);\">Anrede<\u002Flabel>\n              <sc-raw-select id=\"f-anrede\" name=\"anrede\" required=\"{{ true }}\" style=\"font-family:var(--font-brand);font-size:0.9375rem;font-weight:400;color:var(--text-primary);background:#fff;padding:11px 40px 11px 14px;border:1.5px solid var(--border-default);border-radius:var(--radius-md);outline:none;cursor:pointer;appearance:none;-webkit-appearance:none;background-image:url('data:image/svg+xml;utf8,&lt;svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2214%22 height=%2214%22 sc-camel-view-box=%220 0 24 24%22 fill=%22none%22 stroke=%22%232C3A35%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22&gt;&lt;polyline points=%226 9 12 15 18 9%22/&gt;&lt;/svg&gt;');background-repeat:no-repeat;background-position:right 14px center;\">\n                <option value=\"\">Bitte auswählen<\u002Foption>\n                <option value=\"Herr\">Herr<\u002Foption>\n                <option value=\"Frau\">Frau<\u002Foption>\n                <option value=\"Divers\">Divers<\u002Foption>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;\">\n              <x-import component-from-global-scope=\"SchummUndRSchDesignSystem_65897b.Input\" label=\"Vorname\" name=\"firstname\" placeholder=\"Vorname\" required=\"{{ true }}\" hint-size=\"100%,64px\"><\u002Fx-import>\n              <x-import component-from-global-scope=\"SchummUndRSchDesignSystem_65897b.Input\" label=\"Nachname\" name=\"lastname\" placeholder=\"Nachname\" required=\"{{ true }}\" hint-size=\"100%,64px\"><\u002Fx-import>\n            <\u002Fdiv>\n            <x-import component-from-global-scope=\"SchummUndRSchDesignSystem_65897b.Input\" label=\"E-Mail\" name=\"email\" type=\"email\" placeholder=\"du@unternehmen.de\" required=\"{{ true }}\" hint-size=\"100%,64px\"><\u002Fx-import>\n            <x-import component-from-global-scope=\"SchummUndRSchDesignSystem_65897b.Input\" label=\"Telefonnummer\" name=\"phone\" type=\"tel\" placeholder=\"+49 …\" required=\"{{ true }}\" hint-size=\"100%,64px\"><\u002Fx-import>\n            <x-import component-from-global-scope=\"SchummUndRSchDesignSystem_65897b.Input\" label=\"Wunschdatum für deinen Workshop\" name=\"wunschdatum\" type=\"date\" required=\"{{ true }}\" hint-size=\"100%,64px\"><\u002Fx-import>\n            <p style=\"font-size:0.875rem;line-height:1.5;color:var(--text-secondary);margin:0;\">Mit einem Klick auf „Kostenlosen Termin erhalten\" nehme ich die <a href=\"https://cdn.prod.website-files.com/68c2c99d8f9665630c14287f/693ad5f43ed2eb693a239718_Veranstaltungsbedigungen%20202508.pdf\" target=\"_blank\" rel=\"noopener\">Veranstaltungsbedingungen<\u002Fa> an und bestätige, dass ich die <a href=\"https://www.schumms.com/datenschutz\" target=\"_blank\" rel=\"noopener\">Datenschutzerklärung<\u002Fa> zur Kenntnis genommen habe.<\u002Fp>\n            <button type=\"submit\" disabled=\"{{ submitting }}\" style=\"display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:16px 30px;background:var(--sur-green);color:var(--sur-ink);font-weight:700;font-size:1.0625rem;letter-spacing:0.04em;text-transform:uppercase;border-radius:var(--radius-md);border:none;cursor:pointer;width:100%;\">{{ submitLabel }} <span aria-hidden=\"true\">→<\u002Fspan><\u002Fbutton>\n            <sc-if value=\"{{ error }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"text-align:center;font-size:0.8125rem;color:var(--orange-600);font-weight:600;margin:0;\">{{ error }}<\u002Fp>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ notError }}\" hint-placeholder-val=\"{{ true }}\">\n              <p style=\"text-align:center;font-size:0.8125rem;color:var(--text-muted);margin:0;\">Vor Ort · Kostenlos · Unverbindlich<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fform>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FAQ -->\n  <section style=\"background:var(--surface-page);padding:clamp(64px,9vw,120px) clamp(20px,5vw,64px);\">\n    <div style=\"max-width:820px;margin:0 auto;\">\n      <div style=\"margin-bottom:48px;\">\n        <x-import component-from-global-scope=\"SchummUndRSchDesignSystem_65897b.Eyebrow\" color=\"var(--orange-600)\" hint-size=\"auto,18px\">Häufige Fragen<\u002Fx-import>\n        <h2 class=\"disp\" style=\"font-size:clamp(2.25rem,5vw,3.25rem);margin:20px 0 0;\">Gut zu wissen<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;\">\n        <sc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"5\">\n          <div style=\"border-top:1.5px solid var(--border-subtle);\">\n            <button type=\"button\" sc-camel-on-click=\"{{ f.toggle }}\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:24px 0;background:none;border:none;cursor:pointer;text-align:left;font-family:var(--font-brand);\">\n              <span style=\"font-weight:700;font-size:1.1875rem;color:var(--text-primary);\">{{ f.q }}<\u002Fspan>\n              <span style=\"{{ f.iconStyle }}\">+<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ f.open }}\" hint-placeholder-val=\"{{ false }}\">\n              <p class=\"lede\" style=\"font-size:1.0625rem;margin:0;padding:0 0 28px;max-width:64ch;\">{{ f.a }}<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer style=\"background:var(--sur-ink);color:rgba(255,255,255,0.7);padding:clamp(48px,6vw,72px) clamp(20px,5vw,64px);\">\n    <div style=\"max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:28px;\">\n      <img src=\"586124fd-0dd4-487d-826d-bcc228ec24f8\" alt=\"Schumm und Rösch\" style=\"height:26px;width:auto;\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:28px;font-size:0.875rem;\">\n        <a href=\"https://www.schumms.com/impressum\" style=\"color:rgba(255,255,255,0.7);\">Impressum<\u002Fa>\n        <a href=\"https://www.schumms.com/datenschutz\" style=\"color:rgba(255,255,255,0.7);\">Datenschutz<\u002Fa>\n        <span>© 2026 Schumm und Rösch Planen + Einrichten GmbH · Wiesbaden<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { submitted: false, submitting: false, error: null, openFaq: 0 };\n\n  submitToHubspot(e) {\n    e.preventDefault();\n    const form = e.target;\n    const val = (n) => { const el = form.querySelector(`[name=\"${n}\"]`); return el ? el.value.trim() : \"\"; };\n    const fields = [\n      { name: \"anrede\", value: val(\"anrede\") },\n      { name: \"firstname\", value: val(\"firstname\") },\n      { name: \"lastname\", value: val(\"lastname\") },\n      { name: \"email\", value: val(\"email\") },\n      { name: \"phone\", value: val(\"phone\") },\n    ];\n    const wunsch = val(\"wunschdatum\");\n    if (wunsch) fields.push({ name: \"datum_performance_check\", value: new Date(wunsch + \"T00:00:00Z\").getTime() });\n    this.setState({ submitting: true, error: null });\n    fetch(\"https://api-eu1.hsforms.com/submissions/v3/integration/submit/146949753/e2d42711-8e84-4de4-a172-9a12d1ff1ccd\", {\n      method: \"POST\",\n      headers: { \"Content-Type\": \"application/json\" },\n      body: JSON.stringify({ fields, context: { pageUri: location.href, pageName: document.title } }),\n    })\n      .then((r) => { if (!r.ok) throw new Error(\"HTTP \" + r.status); return r.json(); })\n      .then(() => this.setState({ submitted: true, submitting: false }))\n      .catch(() => this.setState({ submitting: false, error: \"Das hat leider nicht geklappt. Bitte versuch es erneut oder schreib uns direkt.\" }));\n  }\n\n  renderVals() {\n    const faqData = [\n      { q: \"Was kostet der Workshop?\", a: \"Nichts. Der HR@WORK Workshop ist für euch komplett kostenlos und unverbindlich.\" },\n      { q: \"Wo findet der Workshop statt?\", a: \"Ganz wie es für euch passt: bei euch im Büro — in genau den Räumen, um die es geht — oder bei uns auf unserer Fläche.\" },\n      { q: \"Für wen ist der Workshop gedacht?\", a: \"HR, People & Culture, Geschäftsführung und alle, die Arbeitswelten aktiv gestalten.\" },\n      { q: \"Was passiert nach der Anmeldung?\", a: \"Wir melden uns bei dir, um einen passenden Termin für euch abzustimmen.\" },\n      { q: \"Wie können wir uns vorbereiten?\", a: \"Ihr müsst nichts vorbereiten. Bringt eure Fragen und eure Räume mit — den Rest machen wir gemeinsam.\" },\n    ];\n    const faqs = faqData.map((f, i) => {\n      const open = this.state.openFaq === i;\n      return {\n        q: f.q, a: f.a, open,\n        toggle: () => this.setState((s) => ({ openFaq: s.openFaq === i ? -1 : i })),\n        iconStyle: `flex-shrink:0;width:32px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:400;line-height:1;background:${open ? \"var(--sur-orange)\" : \"var(--surface-sunken)\"};color:var(--sur-ink);transform:rotate(${open ? 45 : 0}deg);transition:transform .18s ease, background .18s ease;`,\n      };\n    });\n\n    const E = React.createElement;\n    const svgIcon = (kids) => E(\"svg\", { width: 24, height: 24, viewBox: \"0 0 24 24\", fill: \"none\", stroke: \"var(--orange-600)\", strokeWidth: 1.75, strokeLinecap: \"round\", strokeLinejoin: \"round\" }, kids);\n    const icons = {\n      search: svgIcon([E(\"circle\", { key: 1, cx: 11, cy: 11, r: 8 }), E(\"path\", { key: 2, d: \"m21 21-4.3-4.3\" })]),\n      users: svgIcon([E(\"path\", { key: 1, d: \"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\" }), E(\"circle\", { key: 2, cx: 9, cy: 7, r: 4 }), E(\"path\", { key: 3, d: \"M22 21v-2a4 4 0 0 0-3-3.87\" }), E(\"path\", { key: 4, d: \"M16 3.13a4 4 0 0 1 0 7.75\" })]),\n      trending: svgIcon([E(\"polyline\", { key: 1, points: \"22 7 13.5 15.5 8.5 10.5 2 17\" }), E(\"polyline\", { key: 2, points: \"16 7 22 7 22 13\" })]),\n    };\n\n    return {\n      submitted: this.state.submitted,\n      notSubmitted: !this.state.submitted,\n      submitting: this.state.submitting,\n      submitLabel: this.state.submitting ? \"Wird gesendet …\" : \"Kostenlosen Termin erhalten\",\n      error: this.state.error,\n      notError: !this.state.error,\n      submit: (e) => this.submitToHubspot(e),\n      faqs,\n      perks: [\n        \"Objektiver Expertenblick mit aktuellem Trendwissen\",\n        \"Klarheit über Stärken und Potenziale eurer Arbeitsumgebung\",\n        \"Konkrete Umsetzungsideen für die nächsten Schritte\",\n      ],\n      program: [\n        { n: \"01\", title: \"Bestandsaufnahme\", icon: icons.search, desc: \"Analyse eurer aktuellen Situation und Räume.\" },\n        { n: \"02\", title: \"Bewertung\", icon: icons.users, desc: \"Kommunikation, Employer Experience und Employer Branding im Blick.\" },\n        { n: \"03\", title: \"Handlungsfelder\", icon: icons.trending, desc: \"Identifikation zentraler Handlungsfelder und Entwicklung erster Ideen.\" },\n      ],\n      benefits: [\n        { n: \"01\", title: \"Expertenblick\", body: \"Objektiver Blick von außen mit aktuellem Trendwissen zu modernen Arbeitswelten.\" },\n        { n: \"02\", title: \"Klarheit\", body: \"Ein klares Bild über Stärken und Potenziale eurer Arbeitsumgebung.\" },\n        { n: \"03\", title: \"Umsetzung\", body: \"Konkrete Umsetzungsideen sowie Inspiration und Motivation für die nächsten Schritte.\" },\n      ],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
