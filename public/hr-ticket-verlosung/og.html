<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'Buenos Aires';src:url('/fonts/BuenosAires-Black900.woff2') format('woff2');font-weight:900;font-style:normal;}
@font-face{font-family:'Buenos Aires';src:url('/fonts/BuenosAires-SemiBold600.woff2') format('woff2');font-weight:600;font-style:normal;}
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1200px;height:630px;overflow:hidden;background:#0E3B3D;font-family:'Buenos Aires',system-ui,sans-serif;}
#wrap{width:1200px;height:630px;display:flex;flex-direction:column;justify-content:center;padding:0 100px;position:relative;}
.eyebrow{display:inline-flex;align-items:center;gap:12px;color:#00D1A3;font-size:26px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;}
.eyebrow i{width:36px;height:3px;background:currentColor;display:inline-block;}
h1{font-size:92px;font-weight:900;line-height:1.12;color:#fff;margin-top:30px;letter-spacing:-0.01em;}
h1 .accent{color:#00D1A3;}
.logo{position:absolute;left:100px;bottom:56px;}
.logo img{height:22px;width:auto;display:block;}
</style>
</head>
<body>
<div id="wrap">
  <div><span class="eyebrow"><i></i>HR Ticket Verlosung</span></div>
  <h1>Jetzt <span class="accent">1 von 3</span><br>Tickets gewinnen!</h1>
  <div class="logo"><img src="/images/schumms-logo-white.png" alt="Schumm und Rösch"></div>
</div>
</body>
</html>
